server:
  port: 9000
spring:
  profiles:
    active: qa
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

build:
  version: 3.0


cards:
  message:
    welcome: Welcome to the cards Service from dev team
    error: An error occurred while processing your request.
  contactDetails:
    email: "devsupport@cards.com"
    name: "cards dev Support Team"
  onCallSupport:
    phone: "+1-800-123-4567"
    hours: "24/7"
