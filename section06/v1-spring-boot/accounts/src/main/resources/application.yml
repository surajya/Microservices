spring:
  profiles:
    active: prod
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

build:
  version: 3.0


accounts:
  message:
    welcome: Welcome to the Accounts Service from dev team
    error: An error occurred while processing your request.
  contactDetails:
    email: "devsupport@accounts.com"
    name: "Accounts dev Support Team"
  onCallSupport:
    phone: "+1-800-123-4567"
    hours: "24/7"
